# Konfigurasi Nginx untuk Hadirin
# Ganti hadirin.example.com dengan domain Anda (setup-vps.sh melakukannya otomatis).
# Certbot akan menambahkan blok HTTPS (port 443) dan redirect HTTP -> HTTPS.

server {
    listen 80;
    listen [::]:80;
    server_name hadirin.example.com www.hadirin.example.com;

    root /var/www/hadirin/public;
    index index.html;

    # Jangan tampilkan versi Nginx
    server_tokens off;

    # ---- Header keamanan ----
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(self), microphone=(), geolocation=(), payment=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    # Aktifkan HSTS SETELAH HTTPS dipastikan berjalan normal (hapus tanda #):
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Halaman utama
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Aset statis: cache 7 hari
    location /assets/ {
        expires 7d;
        add_header Cache-Control "public";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # index.html jangan di-cache supaya update langsung terlihat
    location = /index.html {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(self), microphone=(), geolocation=(), payment=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    }

    # Tolak akses ke file tersembunyi (.git, .env, dll)
    location ~ /\. {
        deny all;
        return 404;
    }

    # Kompresi
    gzip on;
    gzip_types text/css application/javascript image/svg+xml;
    gzip_min_length 1024;

    access_log /var/log/nginx/hadirin.access.log;
    error_log  /var/log/nginx/hadirin.error.log;
}
