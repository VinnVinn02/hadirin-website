<!doctype html>
<!-- Sumber gambar pratinjau link (og:image). Buat ulang: node deploy/make-og.js -->
<html lang="id"><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Literata:opsz,wght@7..72,700&family=Plus+Jakarta+Sans:wght@500;700&display=swap">
<style>
html,body{margin:0;width:1200px;height:630px;overflow:hidden}
body{background:#174F42;color:#fff;font-family:"Plus Jakarta Sans",system-ui,sans-serif;display:grid;grid-template-columns:1fr 360px;gap:56px;padding:72px 80px;box-sizing:border-box;align-items:center}
.brand{display:flex;align-items:center;gap:16px;font-size:30px;font-weight:700}
.logo{width:60px;height:60px;border-radius:16px;background:#fff;color:#1F6F5B;display:grid;place-items:center;font-family:Literata,Georgia,serif;font-size:36px;font-weight:700}
h1{font-family:Literata,Georgia,serif;font-size:56px;line-height:1.1;margin:36px 0 22px;letter-spacing:-.01em}
p{font-size:25px;line-height:1.45;color:#CFE5DC;margin:0}
.card{background:#fff;color:#16302A;border-radius:24px;padding:24px;display:grid;gap:12px}
.row{display:flex;justify-content:space-between;align-items:center;border-radius:14px;padding:14px 18px;font-size:21px;font-weight:700}
.row b{font-family:Literata,Georgia,serif;font-size:32px}
.h{background:#E0F2E8;color:#1F7A4F}.s{background:#FBE9E3;color:#C2563B}.i{background:#E4EEF9;color:#2F68A8}.a{background:#FAF0D2;color:#8A6A12}
</style></head><body>
<div>
  <div class="brand"><div class="logo">H</div>Hadirin</div>
  <h1>Absensi scan wajah &amp; laporan sakit/izin dari orang tua</h1>
  <p>Kamera kelas mencatat siswa yang hadir. Orang tua melapor dari HP. Rekap harian siap.</p>
</div>
<div class="card">
  <div class="row h">Hadir<b>30</b></div>
  <div class="row s">Sakit<b>2</b></div>
  <div class="row i">Izin<b>1</b></div>
  <div class="row a">Belum ada kabar<b>1</b></div>
</div>
</body></html>
